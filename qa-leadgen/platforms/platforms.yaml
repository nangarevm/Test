# Registry of 100 remote/overseas job platforms.
# adapter: builtin | rss | json | manual
# Platforms with adapter=manual are listed for reference; add their career pages
# under sources.custom_career_pages to fetch from them directly.

categories:
  general_remote: General remote job boards
  freelance_gig: Freelance/gig marketplaces
  tech_focused: Tech-focused
  startup_focused: Startup-focused
  region_specific: Region-specific
  writing: Writing
  design: Design
  customer_support: Customer support / virtual assistant
  marketing: Marketing
  eor_global_hiring: Employer-of-record / global hiring platforms
  large_aggregators: Large general aggregators
  other_niche: Other niche/remote-specific

platforms:
  # --- General remote job boards (1-20) ---
  - id: weworkremotely
    name: We Work Remotely
    category: general_remote
    url: https://weworkremotely.com
    adapter: builtin
    builtin_key: weworkremotely
    enabled_by_default: true
    notes: QA-specific RSS feed; may be blocked by Cloudflare in some environments

  - id: remote_co
    name: Remote.co
    category: general_remote
    url: https://remote.co
    adapter: rss
    feed_url: https://remote.co/remote-jobs/feed/
    notes: Public RSS feed; may be slow or unavailable

  - id: remoteok
    name: RemoteOK
    category: general_remote
    url: https://remoteok.com
    adapter: builtin
    builtin_key: remoteok
    enabled_by_default: true

  - id: flexjobs
    name: FlexJobs
    category: general_remote
    url: https://www.flexjobs.com
    adapter: manual
    notes: Paid membership required; no public API

  - id: working_nomads
    name: Working Nomads
    category: general_remote
    url: https://www.workingnomads.com
    adapter: json
    feed_url: https://www.workingnomads.com/api/exposed_jobs/
    enabled_by_default: true
    json_mapping:
      title: title
      company: company_name
      description: description
      link: url
      location: location

  - id: jobspresso
    name: Jobspresso
    category: general_remote
    url: https://jobspresso.co
    adapter: rss
    feed_url: https://jobspresso.co/feed/
    enabled_by_default: true

  - id: remotive
    name: Remotive
    category: general_remote
    url: https://remotive.com
    adapter: builtin
    builtin_key: remotive
    enabled_by_default: true

  - id: nodesk
    name: NoDesk
    category: general_remote
    url: https://nodesk.co
    adapter: manual
    notes: Browse manually or add specific job listing URLs

  - id: justremote
    name: JustRemote
    category: general_remote
    url: https://justremote.co
    adapter: manual
    notes: No stable public feed; add career page URLs manually

  - id: skipthedrive
    name: SkipTheDrive
    category: general_remote
    url: https://www.skipthedrive.com
    adapter: manual

  - id: virtual_vocations
    name: Virtual Vocations
    category: general_remote
    url: https://www.virtualvocations.com
    adapter: manual
    notes: Paid service; no public API

  - id: pangian
    name: Pangian
    category: general_remote
    url: https://pangian.com
    adapter: manual

  - id: himalayas
    name: Himalayas.app
    category: general_remote
    url: https://himalayas.app
    adapter: json
    feed_url: https://himalayas.app/jobs/api?limit=200&category=qa
    enabled_by_default: true
    json_mapping:
      items_path: jobs
      title: title
      company: companyName
      description: description
      link: applicationLink
      location: locationRestrictions
      employment_type: employmentType

  - id: grow_remote
    name: Grow Remote
    category: general_remote
    url: https://growremote.com
    adapter: manual

  - id: dynamite_jobs
    name: Dynamite Jobs
    category: general_remote
    url: https://dynamitejobs.com
    adapter: manual

  - id: remoteleaf
    name: RemoteLeaf
    category: general_remote
    url: https://remoteleaf.com
    adapter: manual

  - id: dailyremote
    name: DailyRemote
    category: general_remote
    url: https://dailyremote.com
    adapter: manual
    notes: Cloudflare-protected; no reliable public feed

  - id: remotehub
    name: RemoteHub
    category: general_remote
    url: https://remotehub.io
    adapter: manual

  - id: jobvertise
    name: Jobvertise
    category: general_remote
    url: https://www.jobvertise.com
    adapter: manual

  - id: remote4me
    name: Remote4Me
    category: general_remote
    url: https://remote4me.com
    adapter: manual

