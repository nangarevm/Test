# Copy to config.yaml and fill in your values.

user:
  name: "Your Name"
  email: "you@example.com"
  phone: "+1-555-0100"
  resume_path: "./resume.pdf"
  website: "https://yourportfolio.com"

search:
  # Full QA keyword list: config/qa_search_keywords.yaml (43+ terms)
  use_default_keywords: true
  keywords:
    - "freelance qa"
    - "contract qa"
  # Default list already includes: qa engineer, quality assurance, sdet,
  # test automation engineer, manual tester, selenium, playwright, cypress,
  # appium, mobile qa, game tester, uat, and all titles from your search list.
  # When true, only keep freelance/contract/part-time roles
  only_freelance: true
  employment_types:
    - freelance
    - contract
    - part_time
  locations:
    - "remote"
    - "United States"

sources:
  # Legacy toggles (maps to platform registry entries)
  remoteok: true
  weworkremotely: true
  remotive: true
  arbeitnow: true
  indeed: false          # requires INDEED_PUBLISHER_ID in .env
  upwork: true           # best source for freelance QA; requires Upwork OAuth in .env
  wellfound: false
  linkedin_jobs: false
  custom_career_pages:
    - "https://careers.example.com/jobs"

# Platform registry (192 job boards across 57+ countries — see platforms/*.yaml)
platform_registry:
  # Enable all platforms with a working public feed/API adapter
  auto_enable_feeds: true
  # Or enable entire categories: general_remote, freelance_gig, tech_focused,
  # startup_focused, region_specific, writing, design, customer_support,
  # marketing, eor_global_hiring, large_aggregators, other_niche
  groups: []
  # Explicitly include/exclude platform IDs (overrides groups)
  include: []
  exclude:
    - flexjobs           # paid, no public API
    - fiverr             # gig marketplace, no job feed
    - problogger         # writing-focused
    - dribbble           # design-focused
    - remote_woman       # niche community board

email:
  provider: "smtp"       # smtp | sendgrid | mailgun
  daily_limit: 45
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  sendgrid_api_key: ""   # or set SENDGRID_API_KEY in .env
  mailgun_api_key: ""    # or set MAILGUN_API_KEY in .env
  mailgun_domain: ""

enrichment:
  enabled: true
  request_delay_seconds: 2
  user_agent: "QA-LeadGen-Bot/1.0 (compliant business contact lookup)"

output:
  directory: "./data"
  jobs_tracker: "job_requirements_tracker.xlsx"
  company_directory: "company_directory.xlsx"
  # Excel tracker includes: All Jobs, Daily Summary, one sheet per day (YYYY-MM-DD),
  # Overseas Job Boards directory, and Work Mode column (Remote/Hybrid/Office)

# Telegram delivery — sends Excel reports on a schedule
telegram:
  enabled: true
  bot_token: ""          # or set TELEGRAM_BOT_TOKEN in .env
  chat_id: ""            # or set TELEGRAM_CHAT_ID in .env
  interval_hours: 12     # how often to fetch + send when scanning is ON
  include_company_directory: true
  message_template: |
    QA Lead-Gen report ({timestamp})
    Jobs tracked: {job_count}
    Remote: {remote_count} | Hybrid: {hybrid_count} | Office: {office_count}
    Freelance/contract: {freelance_count}
    New: {new_count} | Contacted: {contacted_count} | Responded: {responded_count}

# Full automation — bot + scanning runs in background without manual steps
automation:
  enabled: true
  scanning_on_boot: true       # auto-enable 12h scanning when daemon starts
  run_on_boot: true            # fetch + send Excel immediately on daemon start
  pid_file: "qa-leadgen.pid"   # stored under output directory
  log_file: "automation.log"   # stored under output directory
