name: QA Lead-Gen Scheduled Fetch

on:
  schedule:
    # Every 12 hours at minute 0 (UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-leadgen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config
        run: cp config.example.yaml config.yaml

      - name: Fetch jobs and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEED_PUBLISHER_ID: ${{ secrets.INDEED_PUBLISHER_ID }}
          UPWORK_ACCESS_TOKEN: ${{ secrets.UPWORK_ACCESS_TOKEN }}
        run: |
          python main.py fetch --all-qa
          python main.py telegram send
